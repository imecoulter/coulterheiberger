<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="skyT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252D36"/>
      <stop offset="38%" stop-color="#4E4F54"/>
      <stop offset="70%" stop-color="#9E8C77"/>
      <stop offset="100%" stop-color="#D6C3A6"/>
    </linearGradient>
    <linearGradient id="waterT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3B3B"/>
      <stop offset="100%" stop-color="#1B2026"/>
    </linearGradient>
    <linearGradient id="litfaceT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A7A64"/>
      <stop offset="100%" stop-color="#4A4741"/>
    </linearGradient>
    <filter id="grainT">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="hazeT" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#skyT)"/>

  <path d="M0 726 L180 704 L380 722 L580 700 L800 724 L800 756 L0 756 Z"
        fill="#6C6A69" opacity="0.5" filter="url(#hazeT)"/>

  <!-- the same principal massing, cropped closer and framed vertically -->
  <rect x="150" y="196" width="330" height="560" fill="#1E242A"/>
  <rect x="480" y="196" width="150" height="560" fill="url(#litfaceT)"/>
  <rect x="630" y="430" width="170" height="326" fill="#232A31"/>
  <rect x="40" y="470" width="110" height="286" fill="#272D33"/>

  <g fill="#E8C88E">
    <rect x="492" y="262" width="126" height="8" opacity="0.85"/>
    <rect x="492" y="350" width="126" height="8" opacity="0.72"/>
    <rect x="492" y="438" width="126" height="8" opacity="0.6"/>
    <rect x="492" y="526" width="126" height="8" opacity="0.48"/>
    <rect x="492" y="614" width="126" height="8" opacity="0.36"/>
    <rect x="182" y="300" width="266" height="4" opacity="0.3"/>
    <rect x="182" y="404" width="266" height="4" opacity="0.24"/>
    <rect x="182" y="508" width="266" height="4" opacity="0.18"/>
  </g>

  <rect x="0" y="756" width="800" height="244" fill="url(#waterT)"/>
  <rect x="492" y="770" width="126" height="120" fill="#E8C88E" opacity="0.15"/>
  <g fill="#8E9AA4" opacity="0.09">
    <rect x="0" y="786" width="800" height="2"/>
    <rect x="0" y="836" width="800" height="2"/>
    <rect x="0" y="906" width="800" height="2"/>
  </g>
  <rect x="0" y="754" width="800" height="3" fill="#B9A88E" opacity="0.35"/>

  <rect width="800" height="1000" filter="url(#grainT)" opacity="0.09"/>
</svg>
