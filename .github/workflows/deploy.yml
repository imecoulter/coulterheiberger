name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; a superseded push is not worth shipping.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    # 10 until the gallery moved to AVIF, and the number was set when this repo
    # held three scaffold Projects. It now holds six real ones and emits 679
    # image variants, and a COLD build measured 7m11s here — against a budget
    # step that is ~6 minutes of Lighthouse by design, 15 runs across 5 URLs.
    # The two together cannot fit in 10, so the job was killed mid-budget and
    # reported `cancelled`, which is not a word any gate says on its own.
    #
    # A cold build is not an anomaly to be tuned away: it happens by design
    # every time the source images or the variant set change, and the cache
    # below exists to stop it happening on every OTHER push. The timeout is
    # meant to catch a runaway build, not to cap legitimate encoding.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Gates docs/asset-delivery.md §4 on every tracked image under src/. Runs
      # before the build because it reads tracked files, not dist/ — so it fails
      # fast, and it fails on the PR, which is the last cheap moment.
      - name: Asset spec
        run: npm run check:assets

      - name: Type check
        run: npm run check

      # Astro's processed-image cache, moved out of node_modules by
      # astro.config.mjs so `npm ci` above cannot delete it. Content-addressed
      # per variant, so the restore-keys prefix gives partial reuse: adding one
      # Project re-encodes that Project's variants and restores the rest. The
      # first run on any new key is cold regardless — that is the case this
      # exists to stop happening on EVERY push. See issue #3.
      #
      # THE KEY COVERS THE SOURCES *AND* THE TWO FILES THAT DECIDE WHAT COMES
      # OUT OF THEM. It used to hash the images alone, and that has one failure
      # mode which is silent and permanent: change the width ladders or the
      # delivery formats without touching a single .jpg, and the key still
      # matches. actions/cache only SAVES on a primary-key miss, so the build
      # encodes every new variant, throws them away at the end, and the next run
      # does it again. Measured: the gallery's move to AVIF cost 7m11s of
      # encoding that was never persisted, on a key that hit.
      #
      # A miss is the cheap case, not the expensive one — restore-keys still
      # restores the newest cache, so only the genuinely new variants encode,
      # and this time they are kept. Both files are stable by nature; if a third
      # one starts deciding what gets encoded, it belongs in this list or its
      # decision belongs in src/layout.ts. See FRAME_FORMATS there.
      - name: Restore processed image cache
        uses: actions/cache@v4
        with:
          path: .astro-cache
          key: >-
            astro-assets-${{ hashFiles('src/**/*.{jpg,jpeg,png,svg}',
            'astro.config.mjs', 'src/layout.ts') }}
          restore-keys: |
            astro-assets-

      - name: Build
        run: npm run build

      # Gates on the design direction's hard refusals. See docs/styling.md
      - name: Design rules
        run: npm run check:css

      # Gates the Identity Graph's integrity and ADR-0005's organization-edge
      # refusal. See docs/content-architecture.md §7 and ADR-0012. Runs on the
      # built HTML, so it belongs after Build and not with the source checks.
      - name: Identity Graph
        run: npm run check:structured-data

      # Gates the deploy on the ADR-0002 budget and the ADR-0003 accessibility
      # bar. Config: lighthouserc.cjs — one Lighthouse run serves both.
      - name: Performance and accessibility budget
        run: npm run budget

      # Pull requests verify only. Deploys happen from main.
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Gates ADR-0004's standing rule — if it's on the wire, it's in the repo —
      # against the Served Document, which is the only place edge transforms are
      # visible at all. Every gate above runs on dist/, and dist/ is precisely
      # what an edge-injected script is invisible to: a Web Analytics beacon ran
      # on every page from 2026-08-10 without this pipeline noticing.
      #
      # After the deploy by necessity — the transforms happen at the edge, above
      # the build, so there is nothing to inspect until the bytes are live. It
      # blocks by failing the workflow; a red main is the signal that a dashboard
      # toggle re-opened the hole.
      #
      # The script retries for up to two minutes: seconds after a deploy the edge
      # can still be serving the previous document from cache, which looks exactly
      # like a divergence. It also sends browser headers, without which Cloudflare
      # skips HTML rewriting altogether and the check passes vacuously — do not
      # "simplify" either away.
      - name: Served Document
        if: github.event_name != 'pull_request'
        run: npm run check:served -- https://coulterheiberger.com

      # Fork PRs get no repository secrets, so CLOUDFLARE_API_TOKEN is empty —
      # skip rather than fail the check. Uploads a version only; never promoted
      # to the production custom domain. See issue #9.
      - name: Preview deploy
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/wrangler-output.json
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN (fork PR) — skipping preview deploy."
            exit 0
          fi
          npx wrangler versions upload \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }}"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f wrangler-output.json ]; then
            echo "No preview to comment (skipped or failed upload)."
            exit 0
          fi
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url' wrangler-output.json | tail -n1)
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "No preview URL in wrangler output."
            exit 0
          fi
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "Preview: $url" --edit-last --create-if-none
